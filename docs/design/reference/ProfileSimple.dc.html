<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile simple</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press:hover{filter:brightness(0.97)}
.press:focus-visible{outline:2px solid #14181F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F8FA; font-family: 'DM Sans', system-ui, sans-serif; color: #14181F; overflow: hidden">

  <header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 20px 20px 8px">
    <a class="press" href="Main.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E6E9EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #14181F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Profile</h1>
    <button class="press" onClick="{{toggleMenu}}" aria-label="More options" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="justify-self: end; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E6E9EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: #14181F"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </button>
  </header>

  <div style="display: {{menuShow}}; position: absolute; inset: 0; z-index: 10" onClick="{{closeMenu}}"></div>
  <div role="menu" aria-label="More options" style="display: {{menuShow}}; position: absolute; top: 72px; right: 20px; z-index: 11; width: 220px; padding: 6px; flex-direction: column; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 20px; box-shadow: 0 12px 32px rgba(16,24,40,0.16)">
    <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="4">
      <button role="menuitem" class="press" onClick="{{closeMenu}}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 14px; background: transparent; text-align: left; font-size: 15px; font-weight: 500; color: {{m.color}}">{{m.label}}</button>
    </sc-for>
  </div>

  <main class="noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 36px">

    <!-- profile -->
    <section aria-label="Your profile" style="margin: 12px 20px 0; padding: 18px 20px; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); display: flex; align-items: center; gap: 14px">
      <div aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: #E9EFFD; color: #2548B8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">A</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em">Athul</div>
        <div style="margin-top: 2px; font-size: 13px; color: #5F6B7A">Male · 30 yrs · 175 cm</div>
      </div>
      <a class="press" href="ProfileEdit.dc.html" aria-label="Edit profile" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #F1F3F6; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #14181F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"></path><path d="M14.5 7.5l3 3"></path></svg>
      </a>
    </section>

    <!-- goal -->
    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Goal</h2>
    <section aria-label="Your goal" style="margin: 8px 20px 0; padding: 20px; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04)">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
        <div style="min-width: 0">
          <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2">Lose 0.5 kg a week</div>
          <div style="margin-top: 6px; font-size: 14px; color: #5F6B7A">72.4 kg now · 68 kg goal</div>
        </div>
        <a class="press" href="GoalEdit.dc.html" aria-label="Edit goal" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #F1F3F6; display: flex; align-items: center; justify-content: center; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #14181F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"></path><path d="M14.5 7.5l3 3"></path></svg>
        </a>
      </div>
      <div style="margin-top: 14px; height: 8px; border-radius: 999px; background: #EDF0F4"><div style="width: 45%; height: 100%; border-radius: 999px; background: #22A672"></div></div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid #F0F2F5">
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">2,000</span>
          <span style="font-size: 14px; font-weight: 500; color: #5F6B7A">kcal a day</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px">
        <span style="flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #EEF3FE; font-size: 13px; font-weight: 700; color: #2548B8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3B6FE8"></span>P 120 g</span>
        <span style="flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #FDF3E3; font-size: 13px; font-weight: 700; color: #8A4F05"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D97706"></span>C 230 g</span>
        <span style="flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #F3EEFE; font-size: 13px; font-weight: 700; color: #6D3BD2"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8B5CF6"></span>F 65 g</span>
      </div>
    </section>

    <!-- food -->
    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Food</h2>
    <section aria-label="Food" style="margin: 8px 20px 0; padding: 18px; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="min-width: 0">
        <div style="font-size: 16px; font-weight: 600">Eggetarian</div>
        <div style="margin-top: 4px; font-size: 14px; line-height: 1.45; color: #5F6B7A">Avoids peanuts and mushrooms</div>
      </div>
      <button class="press" aria-label="Edit diet and allergies" style="flex: none; height: 32px; padding: 0 14px; border: 1px solid #E3E7EC; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #14181F">Edit</button>
    </section>

    <!-- 3. settings -->
    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Settings</h2>
    <section aria-label="Settings" style="margin: 8px 20px 0; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); overflow: hidden">
      <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 8px 18px; border-bottom: 1px solid #F0F2F5">
        <span style="font-size: 15px; font-weight: 500">Units</span>
        <div role="group" aria-label="Units" style="display: flex; gap: 2px; padding: 3px; background: #F1F3F6; border-radius: 999px">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
            <button class="press" aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: {{u.bg}}; color: {{u.color}}; box-shadow: {{u.shadow}}; font-size: 13px; font-weight: 600">{{u.label}}</button>
          </sc-for>
        </div>
      </div>
      <sc-for list="{{switches}}" as="s" hint-placeholder-count="2">
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 18px; border-bottom: 1px solid #F0F2F5">
          <div style="min-width: 0">
            <div style="font-size: 15px; font-weight: 500">{{s.label}}</div>
            <div style="font-size: 12px; color: #5F6B7A">{{s.sub}}</div>
          </div>
          <button class="press" role="switch" aria-checked="{{s.on}}" aria-label="{{s.label}}" onClick="{{s.flip}}" style="flex: none; position: relative; width: 48px; height: 28px; border: 0; border-radius: 999px; background: {{s.track}}; padding: 0">
            <span style="position: absolute; top: 3px; left: {{s.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(16,24,40,0.25)"></span>
          </button>
        </div>
      </sc-for>
      <button class="press" style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border: 0; background: transparent; text-align: left">
        <span style="font-size: 15px; font-weight: 500">Subscription</span>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #9AA3B0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </section>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const metric = st.metric != null ? st.metric : true;
    const sw = st.sw || [true, false];
    const menu = !!st.menu;

    const units = [['Metric', true], ['Imperial', false]].map((u) => {
      const on = metric === u[1];
      return {
        label: u[0], on: on,
        bg: on ? '#FFFFFF' : 'transparent',
        color: on ? '#14181F' : '#5F6B7A',
        shadow: on ? '0 1px 3px rgba(16,24,40,0.10)' : 'none',
        pick: () => this.setState({ metric: u[1] })
      };
    });
    const defs = [
      { label: 'Meal reminders', sub: 'A nudge if you have not logged by 2 PM' },
      { label: 'Sync with Health', sub: 'Steps and weight from Apple Health' }
    ];
    const switches = defs.map((d, i) => ({
      label: d.label, sub: d.sub, on: sw[i],
      track: sw[i] ? '#22A672' : '#D5DAE1',
      knob: sw[i] ? '23px' : '3px',
      flip: () => { const n = sw.slice(); n[i] = !n[i]; this.setState({ sw: n }); }
    }));
    const menuItems = [
      { label: 'Help and feedback', color: '#14181F' },
      { label: 'Export my data', color: '#14181F' },
      { label: 'Log out', color: '#14181F' },
      { label: 'Delete account', color: '#C42B36' }
    ];
    return {
      units: units, switches: switches, menuItems: menuItems,
      menuOpen: menu, menuShow: menu ? 'flex' : 'none',
      toggleMenu: () => this.setState({ menu: !menu }),
      closeMenu: () => this.setState({ menu: false })
    };
  }
}
</script>
</body>
</html>
