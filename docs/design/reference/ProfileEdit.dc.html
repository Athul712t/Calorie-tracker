<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press:hover{filter:brightness(0.97)}
.press:focus-visible{outline:2px solid #14181F;outline-offset:2px}
.field:focus-within{border-color:#3B82F6}
.num{font-family:inherit;outline:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F8FA; font-family: 'DM Sans', system-ui, sans-serif; color: #14181F; overflow: hidden">

  <header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 20px 20px 8px">
    <a class="press" href="ProfileSimple.dc.html" aria-label="Back to Profile" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E6E9EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #14181F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Edit profile</h1>
    <span></span>
  </header>

  <main class="noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 120px">

    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 12px">
      <div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; background: #E9EFFD; color: #2548B8; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700">{{initial}}</div>
      <button class="press" style="height: 40px; padding: 0 14px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #2563EB">Change photo</button>
    </div>

    <h2 style="margin: 12px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">About you</h2>
    <div style="display: flex; flex-direction: column; gap: 10px; margin: 8px 20px 0">
      <label class="field" style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; background: #FFFFFF; border: 1.5px solid #ECEEF2; border-radius: 22px">
        <span style="font-size: 16px; font-weight: 600">Name</span>
        <input class="num" type="text" value="{{name}}" onInput="{{onName}}" aria-label="Name" style="width: 170px; border: 0; background: transparent; padding: 0; text-align: right; font-size: 18px; font-weight: 700; color: #14181F">
      </label>
      <div role="group" aria-label="Sex" style="display: flex; gap: 2px; padding: 4px; background: #ECEFF3; border-radius: 999px">
        <sc-for list="{{sexes}}" as="x" hint-placeholder-count="2">
          <button class="press" aria-pressed="{{x.on}}" onClick="{{x.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: {{x.bg}}; color: {{x.color}}; box-shadow: {{x.shadow}}; font-size: 14px; font-weight: 600">{{x.label}}</button>
        </sc-for>
      </div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="2">
        <label class="field" style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; background: #FFFFFF; border: 1.5px solid #ECEEF2; border-radius: 22px">
          <span style="font-size: 16px; font-weight: 600">{{f.label}}</span>
          <span style="display: inline-flex; align-items: baseline; gap: 6px">
            <input class="num" type="text" inputmode="decimal" value="{{f.value}}" onInput="{{f.input}}" aria-label="{{f.label}} in {{f.unit}}" style="width: 84px; border: 0; background: transparent; padding: 0; text-align: right; font-size: 20px; font-weight: 700; color: #14181F">
            <span style="width: 28px; font-size: 14px; font-weight: 500; color: #5F6B7A">{{f.unit}}</span>
          </span>
        </label>
      </sc-for>
    </div>

    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Activity level</h2>
    <div role="group" aria-label="Activity level" style="display: flex; gap: 2px; margin: 8px 20px 0; padding: 4px; background: #ECEFF3; border-radius: 999px">
      <sc-for list="{{acts}}" as="a" hint-placeholder-count="3">
        <button class="press" aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: {{a.bg}}; color: {{a.color}}; box-shadow: {{a.shadow}}; font-size: 14px; font-weight: 600">{{a.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 8px 28px 0; font-size: 13px; color: #5F6B7A">{{actNote}}</p>

    <p style="margin: 20px 28px 0; font-size: 13px; line-height: 1.5; color: #5F6B7A">These details are used to work out your daily calories. Your weight comes from your weigh-ins on Home.</p>

  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 40px 20px 24px; background: linear-gradient(180deg, #F7F8FA00 0%, #F7F8FA 45%); pointer-events: none">
    <a class="press" href="ProfileSimple.dc.html" style="pointer-events: auto; height: 56px; border-radius: 999px; background: #14181F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 24px rgba(20,24,31,0.24)">Save</a>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const name = st.name != null ? st.name : 'Athul';
    const sex = st.sex || 'male';
    const age = st.age != null ? st.age : '30';
    const height = st.height != null ? st.height : '175';
    const act = st.act != null ? st.act : 0;
    const seg = (label, on, pick) => ({
      label: label, on: on, pick: pick,
      bg: on ? '#FFFFFF' : 'transparent',
      color: on ? '#14181F' : '#5F6B7A',
      shadow: on ? '0 1px 3px rgba(16,24,40,0.10)' : 'none'
    });
    const ACTS = [
      ['Light', 'Mostly sitting, light movement'],
      ['Moderate', 'Exercise 3 to 4 days a week'],
      ['Active', 'Exercise most days or a physical job']
    ];
    return {
      name: name,
      initial: (name.trim().charAt(0) || '?').toUpperCase(),
      onName: (e) => this.setState({ name: e.target.value }),
      sexes: [['male', 'Male'], ['female', 'Female']].map((x) => seg(x[1], sex === x[0], () => this.setState({ sex: x[0] }))),
      fields: [
        { label: 'Age', unit: 'yrs', value: age, input: (e) => this.setState({ age: e.target.value }) },
        { label: 'Height', unit: 'cm', value: height, input: (e) => this.setState({ height: e.target.value }) }
      ],
      acts: ACTS.map((a, i) => seg(a[0], i === act, () => this.setState({ act: i }))),
      actNote: ACTS[act][1]
    };
  }
}
</script>
</body>
</html>
