<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press:hover{filter:brightness(0.97)}
.press:focus-visible{outline:2px solid #14181F;outline-offset:2px}
.field:focus-within{border-color:#3B82F6}
.num{font-family:inherit;outline:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F8FA; font-family: 'DM Sans', system-ui, sans-serif; color: #14181F; overflow: hidden">

  <header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 20px 20px 8px">
    <a class="press" href="ProfileSimple.dc.html" aria-label="Back to Profile" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E6E9EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #14181F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Edit goal</h1>
    <span></span>
  </header>

  <main class="noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 130px">

    <!-- live preview -->
    <section aria-label="Your daily target" aria-live="polite" style="margin: 8px 20px 0; padding: 20px; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04)">
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div>
          <div style="font-size: 13px; font-weight: 600; color: #5F6B7A">Daily target</div>
          <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px">
            <span style="font-size: 48px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">{{pv.kcal}}</span>
            <span style="font-size: 16px; font-weight: 500; color: #5F6B7A">kcal</span>
          </div>
        </div>
        <span style="padding: 5px 12px; border-radius: 999px; background: {{pv.chipBg}}; color: {{pv.chipColor}}; font-size: 12px; font-weight: 700">{{pv.chip}}</span>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px">
        <sc-for list="{{pv.macros}}" as="m" hint-placeholder-count="3">
          <div style="flex: 1; padding: 10px 12px; border-radius: 16px; background: {{m.tint}}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{m.deep}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}"></span>{{m.name}}</div>
            <div style="margin-top: 4px; font-size: 18px; font-weight: 700">{{m.g}} g</div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 14px; font-size: 14px; color: #3A4352">{{pv.goalLine}}</div>
    </section>

    <!-- goal -->
    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Goal</h2>
    <div role="group" aria-label="Goal" style="display: flex; gap: 2px; margin: 8px 20px 0; padding: 4px; background: #ECEFF3; border-radius: 999px">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
        <button class="press" aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: {{g.bg}}; color: {{g.color}}; box-shadow: {{g.shadow}}; font-size: 14px; font-weight: 600">{{g.label}}</button>
      </sc-for>
    </div>

    <label class="field" style="display: {{gwShow}}; align-items: center; justify-content: space-between; height: 60px; margin: 12px 20px 0; padding: 0 20px; background: #FFFFFF; border: 1.5px solid #ECEEF2; border-radius: 22px">
      <span style="font-size: 16px; font-weight: 600">Goal weight</span>
      <span style="display: inline-flex; align-items: baseline; gap: 6px">
        <input class="num" type="text" inputmode="decimal" value="{{gw}}" onInput="{{onGw}}" aria-label="Goal weight in kilograms" style="width: 84px; border: 0; background: transparent; padding: 0; text-align: right; font-size: 20px; font-weight: 700; color: #14181F">
        <span style="width: 28px; font-size: 14px; font-weight: 500; color: #5F6B7A">kg</span>
      </span>
    </label>

    <div style="display: {{gwShow}}; flex-direction: column">
      <div style="margin: 18px 24px 0; font-size: 15px; font-weight: 600">Pace</div>
      <div role="group" aria-label="Pace" style="display: flex; gap: 8px; margin: 8px 20px 0">
        <sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
          <button class="press" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="flex: 1; padding: 10px 6px; border-radius: 18px; border: 2px solid {{p.border}}; background: #FFFFFF; text-align: center">
            <span style="display: block; font-size: 15px; font-weight: 700">{{p.label}}</span>
            <span style="display: block; margin-top: 2px; font-size: 12px; color: #5F6B7A">{{p.sub}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- manual -->
    <h2 style="margin: 24px 24px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6B7A">Targets</h2>
    <section aria-label="Calorie and macro targets" style="margin: 8px 20px 0; background: #FFFFFF; border: 1px solid #ECEEF2; border-radius: 28px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); overflow: hidden">
      <div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px">
        <div>
          <div style="font-size: 15px; font-weight: 500">Set manually</div>
          <div style="font-size: 12px; color: #5F6B7A">{{manual.sub}}</div>
        </div>
        <button class="press" role="switch" aria-checked="{{manual.on}}" aria-label="Set calories and macros manually" onClick="{{toggleManual}}" style="flex: none; position: relative; width: 48px; height: 28px; border: 0; border-radius: 999px; background: {{manual.track}}; padding: 0">
          <span style="position: absolute; top: 3px; left: {{manual.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(16,24,40,0.25)"></span>
        </button>
      </div>
      <div style="display: {{manual.show}}; flex-direction: column; padding: 4px 14px 16px; border-top: 1px solid #F0F2F5; gap: 8px">
        <sc-for list="{{manual.fields}}" as="f" hint-placeholder-count="4">
          <label class="field" style="display: flex; align-items: center; justify-content: space-between; height: 54px; margin-top: 4px; padding: 0 16px; background: #F7F8FA; border: 1.5px solid #ECEEF2; border-radius: 18px">
            <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{f.dot}}"></span>{{f.label}}</span>
            <span style="display: inline-flex; align-items: baseline; gap: 6px">
              <input class="num" type="text" inputmode="numeric" value="{{f.value}}" onInput="{{f.input}}" aria-label="{{f.label}} in {{f.unit}}" style="width: 70px; border: 0; background: transparent; padding: 0; text-align: right; font-size: 19px; font-weight: 700; color: #14181F">
              <span style="width: 32px; font-size: 14px; font-weight: 500; color: #5F6B7A">{{f.unit}}</span>
            </span>
          </label>
        </sc-for>
        <div style="margin: 4px 4px 0; font-size: 13px; line-height: 1.45; color: {{manual.noteColor}}">{{manual.note}}</div>
        <button class="press" onClick="{{resetAuto}}" style="align-self: flex-start; height: 36px; padding: 0 14px; border: 1px solid #E3E7EC; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #14181F">Reset to recommended</button>
      </div>
    </section>

    <!-- based on profile -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 28px 0">
      <span style="font-size: 13px; line-height: 1.45; color: #5F6B7A">Based on your profile: Male, 30, 175 cm, 72.4 kg, light activity.</span>
      <a class="press" href="ProfileEdit.dc.html" style="flex: none; height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #E3E7EC; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #14181F; text-decoration: none">Edit</a>
    </div>

  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 40px 20px 24px; background: linear-gradient(180deg, #F7F8FA00 0%, #F7F8FA 45%); pointer-events: none">
    <a class="press" href="ProfileSimple.dc.html" style="pointer-events: auto; height: 56px; border-radius: 999px; background: #14181F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 24px rgba(20,24,31,0.24)">Save · {{pv.kcal}} kcal</a>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const goal = st.goal || 'lose';
    const gw = st.gw != null ? st.gw : '68';
    const pace = st.pace != null ? st.pace : 0.5;
    const manualOn = !!st.manual;
    const NOW = 2000;

    // from the profile (edited on its own screen)
    const SEX = 'male', A = 30, H = 175, W = 72.4, ACT = 1.4;
    const GW = parseFloat(gw);

    const bmr = 10 * W + 6.25 * H - 5 * A + (SEX === 'male' ? 5 : -161);
    const tdee = bmr * ACT;
    const adj = goal === 'lose' ? -pace * 1100 : (goal === 'gain' ? pace * 1100 : 0);
    const auto = Math.max(1200, Math.round((tdee + adj) / 50) * 50);
    const aP = Math.round(1.6 * W);
    const aF = Math.round(auto * 0.25 / 9);
    const aC = Math.max(0, Math.round((auto - aP * 4 - aF * 9) / 4));

    const num = (v, d) => { const n = parseInt(v, 10); return isFinite(n) && n >= 0 ? n : d; };
    const kcalN = manualOn ? num(st.mk, auto) : auto;
    const pG = manualOn ? num(st.mp, aP) : aP;
    const cG = manualOn ? num(st.mc, aC) : aC;
    const fG = manualOn ? num(st.mf, aF) : aF;

    const d = kcalN - NOW;
    const diff = Math.abs(W - (GW || 0));
    const weeks = pace > 0 ? Math.ceil(diff / pace) : 0;
    const when = new Date(2026, 10, 1 + weeks * 7).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

    const pv = {
      kcal: kcalN.toLocaleString('en-IN'),
      chip: manualOn ? 'Custom' : (d === 0 ? 'Same as now' : (d < 0 ? '−' : '+') + Math.abs(d).toLocaleString('en-IN') + ' vs now'),
      chipBg: manualOn ? '#FDF3E3' : (d === 0 ? '#F1F3F6' : '#EEF3FE'),
      chipColor: manualOn ? '#8A4F05' : (d === 0 ? '#3A4352' : '#2548B8'),
      macros: [
        { name: 'Protein', g: pG, dot: '#3B6FE8', deep: '#2548B8', tint: '#EEF3FE' },
        { name: 'Carbs', g: cG, dot: '#D97706', deep: '#8A4F05', tint: '#FDF3E3' },
        { name: 'Fat', g: fG, dot: '#8B5CF6', deep: '#6D3BD2', tint: '#F3EEFE' }
      ],
      goalLine: goal === 'maintain' ? 'Hold steady at ' + W + ' kg.' : 'Reach ' + GW + ' kg by ' + when + ', about ' + weeks + ' weeks.'
    };

    const seg = (label, on, pick) => ({
      label: label, on: on, pick: pick,
      bg: on ? '#FFFFFF' : 'transparent',
      color: on ? '#14181F' : '#5F6B7A',
      shadow: on ? '0 1px 3px rgba(16,24,40,0.10)' : 'none'
    });
    const goals = [['lose', 'Lose weight'], ['maintain', 'Maintain'], ['gain', 'Gain weight']].map((g) =>
      seg(g[1], goal === g[0], () => this.setState({ goal: g[0] })));
    const paces = [[0.25, 'Gentle', '0.25 kg/wk'], [0.5, 'Steady', '0.5 kg/wk'], [0.75, 'Faster', '0.75 kg/wk']].map((p) => ({
      label: p[1], sub: p[2], on: pace === p[0],
      border: pace === p[0] ? '#14181F' : '#ECEEF2',
      pick: () => this.setState({ pace: p[0] })
    }));

    const mTotal = pG * 4 + cG * 4 + fG * 9;
    const gap = mTotal - kcalN;
    const off = Math.abs(gap) > kcalN * 0.05;
    const fld = (label, unit, dot, key, val) => ({
      label: label, unit: unit, dot: dot, value: String(val),
      input: (e) => { const o = {}; o[key] = e.target.value; this.setState(o); }
    });
    const manual = {
      on: manualOn, show: manualOn ? 'flex' : 'none',
      sub: manualOn ? 'Your own calories and macros' : 'Choose your own calories and macros',
      track: manualOn ? '#22A672' : '#D5DAE1', knob: manualOn ? '23px' : '3px',
      fields: [
        fld('Calories', 'kcal', '#14181F', 'mk', kcalN),
        fld('Protein', 'g', '#3B6FE8', 'mp', pG),
        fld('Carbs', 'g', '#D97706', 'mc', cG),
        fld('Fat', 'g', '#8B5CF6', 'mf', fG)
      ],
      note: off
        ? 'Your macros add up to ' + mTotal.toLocaleString('en-IN') + ' kcal, ' + Math.abs(gap).toLocaleString('en-IN') + ' ' + (gap > 0 ? 'more' : 'less') + ' than your calories.'
        : 'Your macros add up to ' + mTotal.toLocaleString('en-IN') + ' kcal. That matches your calories.',
      noteColor: off ? '#8A4F05' : '#5F6B7A'
    };

    return {
      pv: pv, goals: goals, paces: paces, manual: manual,
      gw: gw, gwShow: goal === 'maintain' ? 'none' : 'flex',
      onGw: (e) => this.setState({ gw: e.target.value }),
      toggleManual: () => this.setState({ manual: !manualOn, mk: String(kcalN), mp: String(pG), mc: String(cG), mf: String(fG) }),
      resetAuto: () => this.setState({ manual: false })
    };
  }
}
</script>
</body>
</html>
