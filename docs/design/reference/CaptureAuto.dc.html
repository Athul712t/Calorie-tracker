<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture auto-detect</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.press:hover{filter:brightness(1.08)}
.press:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #0B0E13; font-family: 'DM Sans', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">

  <header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 20px 20px 8px">
    <a class="press" href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 700">{{mode.title}}</h1>
    <button class="press" aria-label="Flash off" style="justify-self: end; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"></path><path d="M4 4l16 16"></path></svg>
    </button>
  </header>

  <!-- viewfinder (placeholder camera view) -->
  <section aria-label="Camera viewfinder" style="position: relative; flex: 1; min-height: 0; margin: 8px 16px 0; border-radius: 32px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #2A3345 0%, #151A24 60%, #0E1118 100%)">
    <button onClick="{{nextScene}}" aria-label="Preview, tap to simulate the next detected item" style="position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer"></button>
    <svg viewBox="0 0 358 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; inset: 0; display: block; pointer-events: none">
      <circle cx="179" cy="260" r="108" style="display: {{mode.plate}}; fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.08); stroke-width: 2"></circle>
      <circle cx="179" cy="260" r="74" style="display: {{mode.plate}}; fill: rgba(255,255,255,0.04)"></circle>
      <rect x="44" y="215" width="270" height="90" rx="10" style="display: {{mode.labelBox}}; fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.10); stroke-width: 2"></rect>
      <g style="display: {{mode.barcode}}">
        <rect x="74" y="225" width="210" height="70" rx="8" style="fill: rgba(255,255,255,0.10)"></rect>
        <path d="M92 235V285M100 235V285M110 235V285M118 235V285M130 235V285M138 235V285M152 235V285M160 235V285M170 235V285M182 235V285M192 235V285M204 235V285M214 235V285M226 235V285M236 235V285M248 235V285M262 235V285" style="fill: none; stroke: rgba(255,255,255,0.35); stroke-width: 3"></path>
      </g>
      <path d="{{mode.brackets}}" style="fill: none; stroke: {{mode.accent}}; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round"></path>
    </svg>
    <div style="display: {{mode.tagsShow}}; position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none">
      <span style="position: absolute; left: 118px; top: 196px; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; color: #14181F; font-size: 12px; font-weight: 700">Dal</span>
      <span style="position: absolute; left: 196px; top: 262px; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; color: #14181F; font-size: 12px; font-weight: 700">Roti ×2</span>
      <span style="position: absolute; left: 100px; top: 318px; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; color: #14181F; font-size: 12px; font-weight: 700">Paneer bhurji</span>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 18px; display: flex; justify-content: center; pointer-events: none">
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: rgba(11,14,19,0.62); font-size: 14px; font-weight: 600">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{mode.accent}}"></span>{{mode.hint}}
      </span>
    </div>
  </section>

  <!-- controls -->
  <div style="flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 36px 32px">
    <button class="press" aria-label="Choose from gallery" style="justify-self: start; width: 56px; height: 56px; border: 0; border-radius: 18px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M4 17l5-4.5 3.5 3L15 13l5 4.5"></path></svg>
    </button>
    <button class="press" aria-label="{{mode.shutter}}" style="width: 80px; height: 80px; padding: 0; border: 4px solid #FFFFFF; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF"></span>
    </button>
    <button class="press" aria-label="Flip camera" style="justify-self: end; width: 56px; height: 56px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"></path><path d="M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"></path><path d="M4 20v-4.5h4.5"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const scene = st.scene != null ? st.scene : 1;
    const br = (x, y, w, h, l) => {
      const r = x + w, b = y + h;
      return 'M' + x + ' ' + (y + l) + 'V' + y + 'H' + (x + l) +
             'M' + (r - l) + ' ' + y + 'H' + r + 'V' + (y + l) +
             'M' + r + ' ' + (b - l) + 'V' + b + 'H' + (r - l) +
             'M' + (x + l) + ' ' + b + 'H' + x + 'V' + (b - l);
    };
    const WHITE = '#FFFFFF', GREEN = '#3DD598';
    const SCENES = [
      { title: 'Looking for food', hint: 'Point at a meal, a label or a barcode', accent: WHITE, brackets: br(49, 120, 260, 280, 34), plate: 'none', labelBox: 'none', barcode: 'none', tags: 'none', shutter: 'Take a photo' },
      { title: 'Meal detected', hint: '3 items found', accent: GREEN, brackets: br(49, 130, 260, 260, 34), plate: 'block', labelBox: 'none', barcode: 'none', tags: 'block', shutter: 'Log this meal' },
      { title: 'Label detected', hint: 'Hold steady to read it', accent: GREEN, brackets: br(24, 190, 310, 160, 34), plate: 'none', labelBox: 'block', barcode: 'none', tags: 'none', shutter: 'Scan this label' },
      { title: 'Barcode detected', hint: 'Finding the product', accent: GREEN, brackets: br(60, 205, 238, 110, 30), plate: 'none', labelBox: 'none', barcode: 'block', tags: 'none', shutter: 'Scan this barcode' }
    ];
    const m = SCENES[scene];
    return {
      mode: { title: m.title, hint: m.hint, accent: m.accent, brackets: m.brackets, plate: m.plate, labelBox: m.labelBox, barcode: m.barcode, tagsShow: m.tags, shutter: m.shutter },
      nextScene: () => this.setState({ scene: (scene + 1) % SCENES.length })
    };
  }
}
</script>
</body>
</html>
