<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.press:hover{filter:brightness(1.08)}
.press:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #0B0E13; font-family: 'DM Sans', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">

  <header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 20px 20px 8px">
    <a class="press" href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 700">{{mode.title}}</h1>
    <button class="press" aria-label="Flash off" style="justify-self: end; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"></path><path d="M4 4l16 16"></path></svg>
    </button>
  </header>

  <!-- viewfinder (placeholder camera view) -->
  <section aria-label="Camera viewfinder" style="position: relative; flex: 1; min-height: 0; margin: 8px 16px 0; border-radius: 32px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #2A3345 0%, #151A24 60%, #0E1118 100%)">
    <svg viewBox="0 0 358 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; inset: 0; display: block">
      <!-- faint plate so the guide reads as a food shot -->
      <circle cx="179" cy="260" r="108" style="display: {{mode.plate}}; fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.08); stroke-width: 2"></circle>
      <circle cx="179" cy="260" r="74" style="display: {{mode.plate}}; fill: rgba(255,255,255,0.04)"></circle>
      <!-- corner brackets -->
      <path d="{{mode.brackets}}" style="fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round"></path>
      <!-- body outline for progress photos -->
      <g style="display: {{mode.body}}; fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 2.5; stroke-dasharray: 6 7; stroke-linecap: round; stroke-linejoin: round">
        <circle cx="179" cy="112" r="24"></circle>
        <path d="M137 168 Q179 150 221 168 L232 280 L212 284 L208 226 L204 330 L206 470 L184 470 L179 340 L174 470 L152 470 L154 330 L150 226 L146 284 L126 280 Z"></path>
      </g>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 18px; display: flex; justify-content: center">
      <span style="padding: 8px 16px; border-radius: 999px; background: rgba(11,14,19,0.62); font-size: 14px; font-weight: 600">{{mode.hint}}</span>
    </div>
    <div style="display: {{mode.anglesShow}}; position: absolute; left: 0; right: 0; bottom: 16px; justify-content: center; gap: 6px">
      <sc-for list="{{angles}}" as="a" hint-placeholder-count="4">
        <button class="press" aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: {{a.bg}}; color: {{a.color}}; font-size: 12px; font-weight: 700">{{a.label}}</button>
      </sc-for>
    </div>
  </section>

  <!-- tabs -->
  <div role="tablist" aria-label="What are you capturing" style="flex: none; display: flex; justify-content: center; margin-top: 16px">
    <div style="display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.12)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button class="press" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 38px; padding: 0 20px; border: 0; border-radius: 999px; background: {{t.bg}}; color: {{t.color}}; font-size: 14px; font-weight: 700">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <!-- controls -->
  <div style="flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 36px 32px">
    <button class="press" aria-label="Choose from gallery" style="justify-self: start; width: 56px; height: 56px; border: 0; border-radius: 18px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M4 17l5-4.5 3.5 3L15 13l5 4.5"></path></svg>
    </button>
    <button class="press" aria-label="{{mode.shutter}}" style="width: 80px; height: 80px; padding: 0; border: 4px solid #FFFFFF; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF"></span>
    </button>
    <button class="press" aria-label="Flip camera" style="justify-self: end; width: 56px; height: 56px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"></path><path d="M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"></path><path d="M4 20v-4.5h4.5"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const tab = st.tab != null ? st.tab : 0;
    const angle = st.angle != null ? st.angle : 0;

    // corner brackets around a rectangle
    const br = (x, y, w, h, l) => {
      const r = x + w, b = y + h;
      return 'M' + x + ' ' + (y + l) + 'V' + y + 'H' + (x + l) +
             'M' + (r - l) + ' ' + y + 'H' + r + 'V' + (y + l) +
             'M' + r + ' ' + (b - l) + 'V' + b + 'H' + (r - l) +
             'M' + (x + l) + ' ' + b + 'H' + x + 'V' + (b - l);
    };
    const MODES = [
      { label: 'Food', title: 'Log a meal', hint: 'Fit the whole plate in the frame', shutter: 'Take a photo of your meal',
        brackets: br(49, 130, 260, 260, 34), plate: 'block', body: 'none' },
      { label: 'Label', title: 'Scan a label', hint: 'Nutrition label or barcode', shutter: 'Scan the label',
        brackets: br(24, 190, 310, 160, 34), plate: 'none', body: 'none' },
      { label: 'Progress', title: 'Progress photo', hint: 'Stand inside the outline', shutter: 'Take a progress photo',
        brackets: br(24, 20, 310, 480, 34), plate: 'none', body: 'block' }
    ];
    const m = MODES[tab];
    const tabs = MODES.map((x, i) => ({
      label: x.label, on: i === tab,
      bg: i === tab ? '#FFFFFF' : 'transparent',
      color: i === tab ? '#0B0E13' : '#FFFFFF',
      pick: () => this.setState({ tab: i })
    }));
    const angles = ['Front', 'Left', 'Right', 'Back'].map((l, i) => ({
      label: l, on: i === angle,
      bg: i === angle ? '#FFFFFF' : 'rgba(11,14,19,0.62)',
      color: i === angle ? '#0B0E13' : '#FFFFFF',
      pick: () => this.setState({ angle: i })
    }));
    return {
      mode: { title: m.title, hint: m.hint, shutter: m.shutter, brackets: m.brackets, plate: m.plate, body: m.body, anglesShow: tab === 2 ? 'flex' : 'none' },
      tabs: tabs,
      angles: angles
    };
  }
}
</script>
</body>
</html>
